---
- name: Check whether K3s server is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s server
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION='v1.36.3+k3s1' sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Wait for K3s node to become Ready
  ansible.builtin.command:
    cmd: kubectl get nodes --no-headers
  register: k3s_nodes
  retries: 12
  delay: 10
  until: k3s_nodes.rc == 0
  changed_when: false

- name: Read K3s node token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token

- name: Store K3s token for worker hosts
  ansible.builtin.set_fact:
    k3s_join_token: "{{ k3s_node_token.content | b64decode | trim }}"
